[project]
name = "storypanel"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.7.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.126",
    "fal-client>=1.0.3",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langfuse>=5.2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "redis>=5",
    "reportlab>=5.1.0",
    "sentry-sdk>=2.74.0",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=3.7.0",
    "stripe>=16.1.0",
    "structlog>=26.1.0",
    "svix>=2.10.0",
    "temporalio>=1.35.0",
    "uvicorn[standard]>=0.54.0",
    "voyageai>=0.5.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "moto[s3,server]>=5.2.5",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pypdf>=7.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-redis>=4.6.0.20241004",
]

[project.scripts]
storypanel-worker = "storypanel.workflows.worker:main"

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["E501", "S101", "S311", "S110", "S112", "B008", "ASYNC109", "ASYNC110", "S608", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E731"]
"src/storypanel/providers/fake.py" = ["S"]
"src/storypanel/evals/harness.py" = ["ASYNC221", "ASYNC240"]  # one-shot CLI: blocking file/git calls are fine

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["storypanel"]
warn_unused_ignores = false
[[tool.mypy.overrides]]
module = ["fal_client.*", "voyageai.*", "reportlab.*", "pgvector.*", "boto3.*", "botocore.*", "svix.*", "stripe.*", "langfuse.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["workflow: needs the Temporal test server", "live: calls real providers (never run in CI)"]
filterwarnings = ["ignore::DeprecationWarning"]
