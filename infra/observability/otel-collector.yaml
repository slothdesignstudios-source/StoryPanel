receivers:
  otlp: { protocols: { http: { endpoint: 0.0.0.0:4318 }, grpc: { endpoint: 0.0.0.0:4317 } } }
processors:
  batch: {}
  memory_limiter: { check_interval: 1s, limit_mib: 256 }
  # Second line of defence: the services already redact, this drops anything that slips through.
  attributes/scrub:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: url.query, action: delete }
      - { key: db.statement, action: delete }
      - { key: db.query.text, action: delete }
  # Keep every error and slow trace; sample the rest. Retention is set in the backend (Tempo: 14 days).
  tail_sampling:
    decision_wait: 10s
    policies:
      - { name: errors, type: status_code, status_code: { status_codes: [ERROR] } }
      - { name: slow, type: latency, latency: { threshold_ms: 5000 } }
      - { name: baseline, type: probabilistic, probabilistic: { sampling_percentage: 20 } }
exporters:
  otlp/tempo: { endpoint: tempo:4317, tls: { insecure: true } }
service:
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, attributes/scrub, tail_sampling, batch], exporters: [otlp/tempo] }
