global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
# DNS service discovery returns every replica of a Compose service (or every instance behind
# a deployment's internal DNS name), so each API and worker instance is its own target and
# sums/absences are computed across all of them.
scrape_configs:
  - { job_name: api, metrics_path: /metrics, dns_sd_configs: [{ names: ["api"], type: A, port: 8000 }] }
  - { job_name: worker, dns_sd_configs: [{ names: ["worker"], type: A, port: 9464 }] }
  - { job_name: temporal, static_configs: [{ targets: ["temporal:9090"] }] }
