# Real receivers for staging/production: pages -> PagerDuty (Events API v2), tickets -> Slack.
# Secrets are read from files mounted at /etc/alertmanager/secrets (a secret store, never this repo):
#   pagerduty_routing_key   PagerDuty service integration key (Events API v2)
#   slack_webhook_url       Slack incoming-webhook URL for the ticket channel
# Same routing as alertmanager.yml (the local drill config).
global: { resolve_timeout: 5m }
route:
  receiver: ticket
  group_by: [alertname, job]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: page
      repeat_interval: 1h
inhibit_rules:
  - source_matchers: [alertname="WorkerDown"]
    target_matchers: [alertname=~"StuckProjects|ActivityQueueAge|OutboxBacklog"]
receivers:
  - name: page
    pagerduty_configs: [{ routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key, send_resolved: true }]
  - name: ticket
    slack_configs: [{ api_url_file: /etc/alertmanager/secrets/slack_webhook_url, send_resolved: true,
                      title: '{{ .CommonLabels.alertname }} ({{ .Status }})',
                      text: '{{ range .Alerts }}{{ .Annotations.summary }} — runbook: {{ .Annotations.runbook }}{{ "\n" }}{{ end }}' }]
