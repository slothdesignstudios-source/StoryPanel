# Alert routing. Pages and tickets go to separate receivers; resolved notifications are sent.
# Receiver URLs are read from files so no secret sits in this config:
#   page:   /etc/alertmanager/secrets/page_url    (PagerDuty Events v2 / Opsgenie / Slack webhook relay)
#   ticket: /etc/alertmanager/secrets/ticket_url  (issue tracker / Slack channel webhook relay)
# Locally both files point at the alert-sink container, which logs what it receives.
global: { resolve_timeout: 5m }
route:
  receiver: ticket
  group_by: [alertname, job]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: page
      repeat_interval: 1h
inhibit_rules:
  # a worker that is completely down explains its other alerts
  - source_matchers: [alertname="WorkerDown"]
    target_matchers: [alertname=~"StuckProjects|ActivityQueueAge|OutboxBacklog"]
receivers:
  - name: page
    webhook_configs: [{ url_file: /etc/alertmanager/secrets/page_url, send_resolved: true }]
  - name: ticket
    webhook_configs: [{ url_file: /etc/alertmanager/secrets/ticket_url, send_resolved: true }]
